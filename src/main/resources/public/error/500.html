<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Internal Server Error</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 100px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 72px;
      color: #ff4757;
    }

    p {
      font-size: 18px;
    }

    .home-button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background-color: #ff4757;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .home-button:hover {
      background-color: #e84141;
    }

    .error-icon {
      font-size: 100px;
      color: #ff4757;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="error-icon">⚠️</div>
  <h1>500</h1>
  <p>Oops! Something went wrong on our end. We're working to fix it as soon as possible.</p>
  <p>Please try again later, or go back to the homepage.</p>
  <a href="/" class="home-button">Go to Homepage</a>
</div>
</body>
</html>
